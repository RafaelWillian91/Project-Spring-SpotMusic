<h4>
    Nova playlist
</h4>

<form th:action="@{/playlists/save}"
      th:method="${playlists.name == null ? 'post' : 'put'}"
      th:object="${playlists}"
      hx-post="/playlists/save"
      hx-target="#conteudo">

    <div class="row">

        <input id="id"
               type="hidden"
               th:field="*{id}"/>

        <div class="form-group col-md-4">

            <label for="name">
                Nome:
            </label>

            <input class="form-control"
                   id="name"
                   type="text"
                   th:field="*{name}"/>

            <div th:if="${#fields.hasErrors('name')}"
                 th:class="${#fields.hasErrors('name')} ? 'alert alert-danger' : ''"
                 th:errors="*{name}">
            </div>

        </div>

        <div class="form-group col-md-8">

            <label for="description">
                Descrição:
            </label>

            <input class="form-control"
                   id="description"
                   type="text"
                   th:field="*{description}"/>

            <div th:if="${#fields.hasErrors('description')}"
                 th:class="${#fields.hasErrors('description')} ? 'alert alert-danger' : ''"
                 th:errors="*{description}">
            </div>

        </div>

    </div>

    <div class="form-group">

        <button class="btn btn-primary"
                type="submit">
            Salvar
        </button>

    </div>

</form>

<hr>

<a class="btn btn-light"
   th:href="@{/playlists/list}"
   th:hx-get="@{/playlists/list}"
   hx-target="#conteudo"
   hx-push-url="true">

    Voltar
</a>

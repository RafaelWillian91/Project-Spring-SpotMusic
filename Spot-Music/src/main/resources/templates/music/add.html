<div>

  <h4>
    Nova música
  </h4>

  <form
          th:action="@{/playlist/{playlistID}/musics/saveMusic(playlistID=${playlistID})}"
          th:method="${music.id} == null ? 'post' : 'put'"
          th:object="${music}"

          th:hx-post="@{/playlist/{playlistID}/musics/saveMusic(playlistID=${playlistID})}"
          hx-target="#conteudo">

    <div class="row">

      <input
              id="id"
              type="hidden"
              th:field="*{id}"/>

      <div class="form-group col-md-4">

        <label for="titulo">
          Título:
        </label>

        <input
                class="form-control"
                id="titulo"
                type="text"
                th:field="*{title}"/>

        <div
                th:if="${#fields.hasErrors('title')}"
                th:class="${#fields.hasErrors('title')} ? 'alert alert-danger' : ''"
                th:errors="*{title}">
        </div>

      </div>


      <div class="form-group col-md-4">

        <label for="banda">
          Banda:
        </label>

        <input
                class="form-control"
                id="banda"
                type="text"
                th:field="*{band}"/>

        <div
                th:if="${#fields.hasErrors('band')}"
                th:class="${#fields.hasErrors('band')} ? 'alert alert-danger' : ''"
                th:errors="*{band}">
        </div>

      </div>


      <div class="form-group col-md-4">

        <label for="nota">
          Nota de 0 a 10:
        </label>

        <input
                class="form-control"
                id="nota"
                type="number"
                min="0"
                max="10"
                th:field="*{score}"/>

        <div
                th:if="${#fields.hasErrors('score')}"
                th:class="${#fields.hasErrors('score')} ? 'alert alert-danger' : ''"
                th:errors="*{score}">
        </div>

      </div>

    </div>


    <div class="form-group">

      <button
              class="btn btn-primary"
              type="submit">

        Salvar

      </button>

    </div>

  </form>


  <hr/>


  <a
          class="btn btn-light"
          th:href="@{/playlist/{playlistID}/musics/listMusic(playlistID=${playlistID})}"
          th:hx-get="@{/playlist/{playlistID}/musics/listMusic(playlistID=${playlistID})}"
          hx-target="#conteudo"
          hx-push-url="true">

    Voltar

  </a>

</div>

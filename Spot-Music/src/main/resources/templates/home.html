<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Spotmusic</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- CSS do projeto -->
    <link href="/css/style.css" rel="stylesheet">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <script>
        function toggleMusica() {
            const musica = document.getElementById('musicaInicio');

            if (musica.paused) {
                musica.play();
            } else {
                musica.pause();
            }
        }
    </script>
</head>

<body>

<div class="container">

    <!-- CABEÇALHO + PLAYER FIXOS -->
    <div class="jumbotron py-4">

        <div class="row align-items-center">

            <!-- TÍTULO -->
            <div class="col-md-8">

                <h1 class="mb-2">
                    <a th:href="@{/home}"
                       th:hx-get="@{/home}"
                       hx-select="#conteudo"
                       hx-target="#conteudo"
                       hx-swap="outerHTML"
                       hx-push-url="true"
                       class="custom-link home">
                        Spotmusic
                    </a>
                </h1>

                <p class="lead mb-0">
                    Crie playlists e avalie músicas
                </p>

            </div>


            <!-- PLAYER -->
            <div class="col-md-4 text-md-right mt-3 mt-md-0">

                <p class="mb-2">
                    Ouça enquanto navega
                </p>

                <audio id="musicaInicio">
                    <source
                            src="/audio/just-pretend.mp3"
                            type="audio/mpeg">
                </audio>

                <button
                        class="btn btn-dark"
                        type="button"
                        onclick="toggleMusica()">

                    ▶ Play / Pause

                </button>

            </div>

        </div>

    </div>


    <!-- CONTEÚDO QUE O HTMX PODERÁ TROCAR -->
    <main id="conteudo">

        <div class="card mb-4">

            <div class="card-body">

                <h3 class="card-title">
                    Conheça as playlists
                </h3>

                <p class="card-text">
                    Aqui você pode acessar as playlists cadastradas
                    ou adicionar novas.
                </p>
                <!--
                    HTMX:
                    hx-get -> faz o GET sem recarregar a página inteira
                    hx-target -> coloca a resposta dentro de #conteudo
                    hx-push-url -> atualiza a URL do navegador
                -->
                <a
                        class="btn btn-success"
                        href="/playlists/list"
                        hx-get="/playlists/list"
                        hx-target="#conteudo"
                        hx-push-url="true">

                    Playlists

                </a>

            </div>

        </div>

    </main>


    <hr>


    <!-- FOOTER FIXO -->
    <footer class="footer mb-4">

        <p>
            © By Rafael Willian
        </p>

    </footer>

</div>

</body>

</html>

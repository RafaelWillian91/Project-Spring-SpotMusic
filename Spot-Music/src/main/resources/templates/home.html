<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Spotmusic</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link href="/css/style.css" rel="stylesheet">

    <script>
    function toggleMusica() {
        const musica = document.getElementById('musicaInicio');

        if (musica.paused) {
            musica.play();
        } else {
            musica.pause();
        }
    }
    </script>
</head>

<body>

<div class="container">

    <div class="jumbotron mt-4 bg-blue">
        <h1>Spotmusic</h1>

        <p class="lead">
            Crie playlists e avalie músicas
        </p>
    </div>

    <div class="row my-5">

        <div class="col-md-6 mb-3">
            <div class="card h-100">
                <div class="card-body">

                    <h3 class="card-title">
                        Ouça uma música
                    </h3>

                    <p class="card-text">
                        Dê o play e entre no clima enquanto explora suas playlists.
                    </p>

                    <audio id="musicaInicio">
                        <source src="/audio/just-pretend.mp3"
                                type="audio/mpeg">
                    </audio>

                    <button
                            class="btn btn-dark"
                            type="button"
                            onclick="toggleMusica()">

                        ▶ Play / Pause
                    </button>

                </div>
            </div>
        </div>

        <div class="col-md-6 mb-3">
            <div class="card h-100">
                <div class="card-body">

                    <h3 class="card-title">
                        Conheça as playlists
                    </h3>

                    <p class="card-text">
                        Aqui você pode acessar as playlists cadastradas
                        ou adicionar novas.
                    </p>

                    <a
                            class="btn btn-success"
                            href="/playlists/list">

                        Playlists
                    </a>

                </div>
            </div>
        </div>

    </div>

    <hr>

    <footer class="footer mb-4">
        <p>© By Rafael Willian</p>
    </footer>

</div>

</body>

</html>
